{% extends 'layout/app.html' %}

{% block content %}

<style>

    body{
        background:#f4f7fc;
    }


    .auth-card{

        background:white;

        padding:40px;

        border-radius:20px;

        box-shadow:0 10px 30px rgba(0,0,0,0.1);

        width:100%;
    }

    .auth-title{

        text-align:center;

        color:#1e3a8a;

        font-weight:bold;

        margin-bottom:30px;

        font-size:40px;
    }

    .form-group{

        margin-bottom:20px;
    }

    .form-group label{

        font-weight:600;

        margin-bottom:8px;

        color:#374151;
    }

    .form-control{

        height:50px;

        border-radius:10px;

        border:1px solid #d1d5db;
    }

    .form-control:focus{

        box-shadow:none;

        border-color:#2563eb;
    }

    .login-btn{

        background:#2563eb;

        color:white;

        border:none;

        width:100%;

        height:50px;

        border-radius:10px;

        font-size:18px;

        font-weight:bold;

        margin-top:10px;

        transition:0.3s;
    }

    .login-btn:hover{

        background:#1d4ed8;
    }

    .bottom-link{

        text-align:center;

        margin-top:20px;
    }

    .bottom-link a{

        text-decoration:none;

        color:#2563eb;

        font-weight:600;
    }

</style>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="col-md-5">

        <div class="auth-card">

            <h2 class="auth-title">
                Login
            </h2>

            {% if form.non_field_errors %}

            <div class="alert alert-danger">

                {{ form.non_field_errors }}

            </div>

            {% endif %}

            <form method="POST" action="{% url 'login' %}">

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input type="text"
                           name="{{ form.username.name }}"
                           class="form-control"
                           placeholder="Enter username">

                    <small class="text-danger">

                        {{ form.username.errors }}

                    </small>

                </div>

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input type="password"
                           name="{{ form.password.name }}"
                           class="form-control"
                           placeholder="Enter password">

                    <small class="text-danger">

                        {{ form.password.errors }}

                    </small>

                </div>

                <button type="submit"
                        class="login-btn">

                    Login

                </button>

            </form>

            <div class="bottom-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}

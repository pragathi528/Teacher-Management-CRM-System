<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Hero Section */

        .hero-section{

            height:100vh;

            background:
            linear-gradient(
                rgba(255,255,255,0.75),
                rgba(255,255,255,0.75)
            ),

            url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            text-align:center;
            padding:20px;
        }

        /* Content Card */

        .hero-content{

            background:white;

            padding:60px 50px;

            border-radius:20px;

            box-shadow:0 10px 30px rgba(0,0,0,0.15);

            max-width:700px;
            width:100%;
        }

        .hero-content h1{

            font-size:60px;

            color:#1e3a8a;

            font-weight:bold;

            margin-bottom:20px;
        }

        .hero-content p{

            font-size:20px;

            color:#555;

            margin-bottom:40px;

            line-height:1.7;
        }

        /* Buttons */

        .btn-custom{

            padding:12px 35px;

            border:none;

            border-radius:50px;

            font-size:18px;

            font-weight:bold;

            transition:0.3s;

            text-decoration:none;

            display:inline-block;
        }

        .login-btn{

            background:#2563eb;

            color:white;

            margin-right:15px;
        }

        .login-btn:hover{

            background:#1d4ed8;

            transform:translateY(-3px);
        }

        .register-btn{

            background:#10b981;

            color:white;
        }

        .register-btn:hover{

            background:#059669;

            transform:translateY(-3px);
        }

        /* Responsive */

        @media(max-width:768px){

            .hero-content h1{
                font-size:40px;
            }

            .hero-content p{
                font-size:16px;
            }

            .btn-custom{
                width:100%;
                margin-bottom:15px;
            }

            .login-btn{
                margin-right:0;
            }
        }

    </style>

</head>

<body>

    <section class="hero-section">

        <div class="hero-content">

            <h1>SCHOOL CRM</h1>

            <p>
                Welcome to the School Management System.
                Manage students, teachers
                and academic records efficiently with
                secure role-based access.
            </p>

            <div>

                <a href="{% url 'login' %}"
                   class="btn-custom login-btn">

                    Login

                </a>

                <a href="{% url 'register' %}"
                   class="btn-custom register-btn">

                    Register

                </a>

            </div>

        </div>

    </section>

</body>
</html>
